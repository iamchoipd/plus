<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title>세 수 계산 달리기</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    font-family:
        "Malgun Gothic",
        "Noto Sans KR",
        Arial,
        sans-serif;

    background: #f3f6fa;
    color: #172033;

    touch-action: manipulation;
}

button,
select,
input {
    font-family: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

.hidden {
    display: none !important;
}


/* =========================================================
   시작 화면
========================================================= */

.start-screen {

    width: min(
        900px,
        calc(100% - 30px)
    );

    margin: 25px auto;

    padding: 30px;

    background: white;

    border-radius: 28px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.08);
}


.main-title {

    margin: 0;

    text-align: center;

    font-size:
        clamp(
            32px,
            5vw,
            52px
        );

    font-weight: 1000;
}


.sub-title {

    margin:
        10px 0 30px;

    text-align: center;

    color: #657085;

    font-size: 19px;

    font-weight: 700;
}


.settings {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 14px;
}


.setting {

    padding: 15px;

    background: #f6f8fb;

    border:
        2px solid
        #dfe6ef;

    border-radius: 18px;
}


.setting label {

    display: block;

    margin-bottom: 8px;

    font-size: 17px;

    font-weight: 900;
}


.setting select {

    width: 100%;

    height: 52px;

    padding:
        0 10px;

    border:
        2px solid
        #ccd7e5;

    border-radius: 12px;

    background: white;

    font-size: 19px;

    font-weight: 800;
}


.names {

    display: grid;

    grid-template-columns:
        repeat(
            5,
            1fr
        );

    gap: 9px;

    margin-top: 18px;
}


.name-input {

    width: 100%;

    height: 52px;

    border:
        2px solid
        #d5deea;

    border-radius: 12px;

    text-align: center;

    font-size: 17px;

    font-weight: 900;
}


.start-btn {

    display: block;

    width:
        min(
            420px,
            100%
        );

    min-height: 68px;

    margin:
        25px auto 0;

    border-radius: 18px;

    background: #2577df;

    color: white;

    font-size: 26px;

    font-weight: 1000;
}


/* =========================================================
   게임 상단
========================================================= */

.game-screen {
    padding: 8px;
}


.game-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 12px;

    padding:
        4px 5px 9px;
}


.game-info {

    font-size:
        clamp(
            17px,
            2vw,
            23px
        );

    font-weight: 900;
}


.exit-btn {

    min-height: 44px;

    padding:
        8px 15px;

    border:
        2px solid
        #ccd7e3;

    border-radius: 11px;

    background: white;

    font-size: 15px;

    font-weight: 900;
}


/* =========================================================
   화면 분할
========================================================= */

.player-grid {

    display: grid;

    width: 100%;

    gap: 8px;
}


.player-grid.count-1 {

    grid-template-columns:
        1fr;
}


.player-grid.count-2 {

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );
}


.player-grid.count-3 {

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );
}


.player-grid.count-4 {

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );
}


.player-grid.count-5 {

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );
}


/* =========================================================
   학생별 화면
========================================================= */

.player-panel {

    position: relative;

    min-width: 0;

    overflow: hidden;

    padding: 10px;

    border:
        4px solid
        var(--player-color);

    border-radius: 20px;

    background: white;
}


.player-head {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 8px;

    margin-bottom: 7px;
}


.player-title {

    display: flex;

    align-items: center;

    gap: 7px;

    min-width: 0;

    font-size:
        clamp(
            17px,
            2vw,
            23px
        );

    font-weight: 1000;
}


.player-name {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


.player-emoji {

    font-size: 27px;
}


.progress-number {

    white-space: nowrap;

    color: #637083;

    font-size: 15px;

    font-weight: 900;
}


/* =========================================================
   레이스
========================================================= */

.track {

    position: relative;

    height: 42px;

    margin-bottom: 9px;

    border:
        2px solid
        #d9e1eb;

    border-radius: 22px;

    background:

        repeating-linear-gradient(

            90deg,

            #eef2f7 0%,

            #eef2f7 8%,

            white 8%,

            white 10%
        );
}


.track::before {

    content: "🚩";

    position: absolute;

    left: 2px;

    top: 50%;

    transform:
        translateY(-50%);

    font-size: 20px;
}


.track::after {

    content: "🏁";

    position: absolute;

    right: 2px;

    top: 50%;

    transform:
        translateY(-50%);

    font-size: 22px;
}


.runner {

    position: absolute;

    left: 6%;

    top: 50%;

    width: 35px;

    height: 35px;

    display: flex;

    justify-content: center;

    align-items: center;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius: 50%;

    background:
        var(--player-color);

    font-size: 21px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.18);

    transition:
        left
        0.7s
        cubic-bezier(
            .2,
            .8,
            .3,
            1
        );
}


/* =========================================================
   문제 전체 영역
========================================================= */

.problem-area {

    padding:
        3px 2px 5px;
}


/* =========================================================
   원래 세 수 계산식
========================================================= */

.original-expression {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    flex-wrap: nowrap;

    gap:
        clamp(
            4px,
            0.8vw,
            10px
        );

    margin:
        6px auto 0;

    font-size:
        clamp(
            31px,
            4vw,
            55px
        );

    line-height: 1.35;

    font-weight: 1000;

    white-space: nowrap;
}


/* 앞의 두 수 묶음 */

.first-group {

    position: relative;

    display: inline-flex;

    align-items: center;

    gap:
        clamp(
            4px,
            0.8vw,
            10px
        );

    padding:
        0 5px 12px;
}


/*
   처음 두 수 아래에
   U자 모양 계산선
*/

.first-group::after {

    content: "";

    position: absolute;

    left: 2px;

    right: 2px;

    bottom: 2px;

    height: 10px;

    border-left:
        4px solid
        #159ed3;

    border-right:
        4px solid
        #159ed3;

    border-bottom:
        4px solid
        #159ed3;

    border-radius:
        0 0 10px 10px;
}


.first-group.done::after {

    border-color:
        #48a757;
}


.expression-token {

    display: inline-flex;

    align-items: center;

    justify-content: center;
}


/* =========================================================
   처음 계산한 답
========================================================= */

.first-step-area {

    display: flex;

    flex-direction: column;

    align-items: center;

    margin-top: 0;
}


.first-down-line {

    width: 4px;

    height: 20px;

    background: #159ed3;
}


.first-down-arrow {

    width: 13px;

    height: 13px;

    margin-top: -7px;

    border-right:
        4px solid
        #159ed3;

    border-bottom:
        4px solid
        #159ed3;

    transform:
        rotate(45deg);
}


.step-caption {

    margin:
        6px 0 5px;

    color: #177ea7;

    font-size:
        clamp(
            12px,
            1.3vw,
            16px
        );

    font-weight: 900;
}


.answer-box {

    width: 72px;

    min-width: 72px;

    height: 58px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        4px solid
        #84c3eb;

    border-radius: 13px;

    background: #eaf6ff;

    font-size: 36px;

    font-weight: 1000;
}


.answer-box.correct {

    border-color: #55b560;

    background: #ddf5df;
}


.answer-box.wrong {

    border-color: #e64f4f;

    background: #ffe1e1;

    animation:
        shake 0.3s;
}


/* =========================================================
   이어서 계산 영역
========================================================= */

.continue-area {

    display: none;

    flex-direction: column;

    align-items: center;

    margin-top: 2px;
}


.continue-area.show {

    display: flex;
}


.continue-line {

    width: 4px;

    height: 18px;

    background: #159ed3;
}


.continue-arrow {

    width: 13px;

    height: 13px;

    margin-top: -7px;

    border-right:
        4px solid
        #159ed3;

    border-bottom:
        4px solid
        #159ed3;

    transform:
        rotate(45deg);
}


.continue-caption {

    margin:
        5px 0;

    padding:
        4px 10px;

    border-radius: 13px;

    background: #e8f7fc;

    color: #087da5;

    font-size:
        clamp(
            12px,
            1.4vw,
            17px
        );

    font-weight: 900;
}


/* =========================================================
   원래 식이 줄어든 모습

   예)
   3 + 2 + 4
       ↓
     5 + 4
========================================================= */

.reduced-expression {

    display: flex;

    justify-content: center;

    align-items: center;

    gap:
        clamp(
            6px,
            1vw,
            12px
        );

    padding:
        7px 12px;

    border:
        3px solid
        #159ed3;

    border-radius: 18px;

    background: #f0faff;
}


.carried-number {

    min-width: 55px;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 11px;

    background: #159ed3;

    color: white;

    font-size:
        clamp(
            28px,
            3vw,
            39px
        );

    font-weight: 1000;

    animation:
        pop 0.35s;
}


.reduced-part {

    font-size:
        clamp(
            27px,
            3vw,
            40px
        );

    font-weight: 1000;

    white-space: nowrap;
}


.final-box {

    width: 72px;

    height: 58px;

    display: flex;

    justify-content: center;

    align-items: center;

    border:
        4px solid
        #b8d765;

    border-radius: 13px;

    background: #f0f8c9;

    font-size: 36px;

    font-weight: 1000;
}


.final-box.correct {

    border-color: #55b560;

    background: #ddf5df;
}


.final-box.wrong {

    border-color: #e64f4f;

    background: #ffe1e1;

    animation:
        shake 0.3s;
}


/* =========================================================
   설명
========================================================= */

.message {

    min-height: 29px;

    margin:
        6px 0;

    text-align: center;

    font-size:
        clamp(
            14px,
            1.6vw,
            20px
        );

    font-weight: 900;
}


.correct-message {
    color: #23812b;
}


.wrong-message {
    color: #c92c2c;
}


/* =========================================================
   숫자판
========================================================= */

.keypad {

    display: grid;

    grid-template-columns:
        repeat(
            5,
            1fr
        );

    gap: 6px;
}


.num-btn {

    min-width: 0;

    min-height: 55px;

    border:
        2px solid
        #d4deea;

    border-radius: 11px;

    background: #f8fafc;

    color: #192537;

    font-size:
        clamp(
            22px,
            2.5vw,
            31px
        );

    font-weight: 1000;

    box-shadow:
        0 2px 0
        #cbd5df;
}


.num-btn:disabled {

    opacity: 0.32;

    cursor: default;

    transform: none;
}


/* =========================================================
   개인 도착
========================================================= */

.personal-finish {

    min-height: 330px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}


.finish-icon {

    font-size:
        clamp(
            58px,
            7vw,
            90px
        );
}


.finish-title {

    margin-top: 3px;

    font-size:
        clamp(
            29px,
            4vw,
            46px
        );

    font-weight: 1000;
}


.finish-name {

    margin-top: 6px;

    color:
        var(--player-color);

    font-size:
        clamp(
            22px,
            3vw,
            34px
        );

    font-weight: 1000;
}


.finish-text {

    margin-top: 8px;

    color: #657085;

    font-size:
        clamp(
            14px,
            1.6vw,
            19px
        );

    font-weight: 800;
}


/* =========================================================
   카운트다운
========================================================= */

.countdown-overlay {

    position: absolute;

    inset: 0;

    z-index: 1000;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(
            255,
            255,
            255,
            0.96
        );
}


.countdown-text {

    color: #2478df;

    font-size:
        clamp(
            80px,
            15vw,
            180px
        );

    font-weight: 1000;
}


/* =========================================================
   애니메이션
========================================================= */

@keyframes shake {

    0% {
        transform:
            translateX(0);
    }

    25% {
        transform:
            translateX(-7px);
    }

    50% {
        transform:
            translateX(7px);
    }

    75% {
        transform:
            translateX(-7px);
    }

    100% {
        transform:
            translateX(0);
    }
}


@keyframes pop {

    0% {
        transform:
            scale(0.7);
    }

    70% {
        transform:
            scale(1.15);
    }

    100% {
        transform:
            scale(1);
    }
}


/* =========================================================
   반응형
========================================================= */

@media (max-width: 1050px) {

    .player-grid.count-3,
    .player-grid.count-5 {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
    }
}


@media (max-width: 700px) {

    .settings {

        grid-template-columns:
            1fr;
    }


    .names {

        grid-template-columns:
            repeat(
                2,
                1fr
            );
    }


    .player-grid.count-2,
    .player-grid.count-3,
    .player-grid.count-4,
    .player-grid.count-5 {

        grid-template-columns:
            1fr;
    }


    .original-expression {

        font-size: 37px;
    }


    .reduced-part {

        font-size: 29px;
    }


    .num-btn {

        min-height: 59px;
    }
}

</style>

</head>

<body>



<!-- ======================================================
     시작 화면
====================================================== -->

<section id="startScreen"
         class="start-screen">

    <h1 class="main-title">

        🏃 세 수 계산 달리기

    </h1>


    <div class="sub-title">

        앞에서부터 차례대로 계산해 목적지에 도착해요!

    </div>


    <div class="settings">


        <div class="setting">

            <label for="playerCount">

                👥 참여 인원

            </label>


            <select id="playerCount">

                <option value="1"
                        selected>

                    1명

                </option>

                <option value="2">

                    2명

                </option>

                <option value="3">

                    3명

                </option>

                <option value="4">

                    4명

                </option>

                <option value="5">

                    5명

                </option>

            </select>

        </div>



        <div class="setting">

            <label for="mode">

                🧮 문제 종류

            </label>


            <select id="mode">

                <option value="add"
                        selected>

                    덧셈

                </option>

                <option value="sub">

                    뺄셈

                </option>

                <option value="mixed">

                    덧셈·뺄셈 섞기

                </option>

            </select>

        </div>



        <div class="setting">

            <label for="goal">

                🏁 목적지까지

            </label>


            <select id="goal">

                <option value="5">

                    5문제

                </option>

                <option value="10"
                        selected>

                    10문제

                </option>

                <option value="15">

                    15문제

                </option>

                <option value="20">

                    20문제

                </option>

            </select>

        </div>

    </div>


    <div id="nameInputs"
         class="names">
    </div>


    <button id="startBtn"
            class="start-btn"
            type="button">

        ▶ 게임 시작

    </button>

</section>



<!-- ======================================================
     게임 화면
====================================================== -->

<section id="gameScreen"
         class="game-screen hidden">


    <header class="game-header">

        <div id="gameInfo"
             class="game-info">

            덧셈 · 목적지 10문제

        </div>


        <button id="exitBtn"
                class="exit-btn"
                type="button">

            처음 화면

        </button>

    </header>


    <div id="playerGrid"
         class="player-grid">
    </div>

</section>



<script>

(() => {

"use strict";


/* ========================================================
   DOM
======================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const playerCountSelect =
    document.getElementById(
        "playerCount"
    );


const modeSelect =
    document.getElementById(
        "mode"
    );


const goalSelect =
    document.getElementById(
        "goal"
    );


const nameInputs =
    document.getElementById(
        "nameInputs"
    );


const playerGrid =
    document.getElementById(
        "playerGrid"
    );


const gameInfo =
    document.getElementById(
        "gameInfo"
    );


const startBtn =
    document.getElementById(
        "startBtn"
    );


const exitBtn =
    document.getElementById(
        "exitBtn"
    );



/* ========================================================
   선수 스타일
======================================================== */

const PLAYER_STYLES = [

    {
        emoji: "🐰",
        color: "#ea6571"
    },

    {
        emoji: "🐯",
        color: "#ef983b"
    },

    {
        emoji: "🐸",
        color: "#50ae64"
    },

    {
        emoji: "🐼",
        color: "#627086"
    },

    {
        emoji: "🦊",
        color: "#9670ce"
    }

];


let players = [];

let gameMode =
    "add";

let goal =
    10;

let audioContext =
    null;

let countdownTimer =
    null;

let stopped =
    false;



/* ========================================================
   이름 입력
======================================================== */

function makeNameInputs() {

    const count =
        Number(
            playerCountSelect.value
        );


    const oldValues =
        [
            ...nameInputs
            .querySelectorAll(
                "input"
            )
        ]
        .map(
            input =>
                input.value
        );


    nameInputs.innerHTML =
        "";


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const input =
            document.createElement(
                "input"
            );


        input.type =
            "text";


        input.className =
            "name-input";


        input.maxLength =
            8;


        input.placeholder =
            `${i + 1}번`;


        input.value =
            oldValues[i] ||
            `${i + 1}번`;


        nameInputs.appendChild(
            input
        );
    }
}



/* ========================================================
   게임 시작
======================================================== */

function startGame() {

    stopped =
        false;


    initAudio();


    const count =
        Number(
            playerCountSelect.value
        );


    gameMode =
        modeSelect.value;


    goal =
        Number(
            goalSelect.value
        );


    const inputs =
        [
            ...nameInputs
            .querySelectorAll(
                "input"
            )
        ];


    players =
        [];


    for (
        let i = 0;
        i < count;
        i++
    ) {

        players.push({

            id: i,

            name:
                inputs[i]
                .value
                .trim() ||
                `${i + 1}번`,

            emoji:
                PLAYER_STYLES[i]
                .emoji,

            color:
                PLAYER_STYLES[i]
                .color,

            progress: 0,

            step: 1,

            locked: true,

            finished: false,

            problem: null,

            panel: null,

            content: null,

            runner: null,

            progressText: null,

            firstGroup: null,

            carriedNumber: null,

            finalAnswer: null,

        });
    }


    startScreen.classList.add(

    );

    );


    playerGrid.className =
        `player-grid count-${count}`;

        ? "뺄셈"

    gameInfo.textContent =

        `${modeName} · 목적지 ${goal}문제`;


    buildPlayerPanels();

    runCountdown();
}

/* ========================================================
   시작 카운트
======================================================== */

function runCountdown() {

    const overlay =
        document.createElement(
            "div"
        );


    overlay.className =
        "countdown-overlay";


    const text =
        document.createElement(
            "div"
        );


    text.className =
        "countdown-text";


    overlay.appendChild(
        text
    );


    gameScreen.style.position =
        "relative";


    gameScreen.appendChild(
        overlay
    );


    const sequence =
        [
            "3",
            "2",
            "1",
            "시작!"
        ];


    let index =
        0;


    function next() {

        if (
            stopped
        ) {

            overlay.remove();

            return;
        }


        text.textContent =
            sequence[index];


        if (
            index < 3
        ) {

            playCountdownSound(

                400 +
                index * 120
            );

        } else {

            playStartSound();
        }


        index++;


        if (
            index <
            sequence.length
        ) {

            countdownTimer =
                setTimeout(

                    next,

                    650
                );

        } else {

            countdownTimer =
                setTimeout(

                    () => {

                        overlay.remove();


                        players
                        .forEach(
                            player => {

                                loadProblem(
                                    player
                                );
                            }
                        );

                    },

                    550
                );
        }
    }


    next();
}



/* ========================================================
   새 문제
======================================================== */

function loadProblem(
    player
) {

    if (
        stopped ||
        player.finished
    ) {

        return;
    }


    player.problem =
        createProblem();


    player.step =
        1;


    player.locked =
        false;


    const p =
        player.problem;



    /* 원래 식 */

    player.numberA
        .textContent =
        p.a;


    player.op1Token
        .textContent =
        p.op1;


    player.numberB
        .textContent =
        p.b;


    player.op2Token
        .textContent =
        p.op2;


    player.numberC
        .textContent =
        p.c;


    player.questionToken
        .textContent =
        "?";



    /* 첫 두 수 묶음 */

    player.firstGroup
        .className =
        "first-group";



    /* 첫 답 */

    player.firstAnswer
        .textContent =
        "";


    player.firstAnswer
        .className =
        "answer-box";



    /* 두 번째 과정은 처음에 숨김 */

    player.continueArea
        .className =
        "continue-area";


    player.finalAnswer
        .textContent =
        "";


    player.finalAnswer
        .className =
        "final-box";



    player.message
        .className =
        "message";


    player.message
        .textContent =
        "① 파란 선으로 묶인 앞의 두 수를 계산해요.";


    setButtonsEnabled(
        player,
        true
    );
}



/* ========================================================
   답 입력
======================================================== */

function submitAnswer(
    playerId,
    number
) {

    const player =
        players[playerId];


    if (
        stopped ||
        !player ||
        player.finished ||
        player.locked
    ) {

        return;
    }


    const p =
        player.problem;



    /* 첫 계산 */

    if (
        player.step === 1
    ) {

        player.firstAnswer
            .textContent =
            number;


        if (
            number ===
            p.middle
        ) {

            firstStepCorrect(
                player
            );

        } else {

            wrongAnswer(

                player,

                player.firstAnswer
            );
        }


        return;
    }



    /* 최종 계산 */

    if (
        player.step === 2
    ) {

        player.finalAnswer
            .textContent =
            number;


        if (
            number ===
            p.answer
        ) {

            finalCorrect(
                player
            );

        } else {

            wrongAnswer(

                player,

                player.finalAnswer
            );
        }
    }
}



/* ========================================================
   첫 두 수 계산 성공
======================================================== */

function firstStepCorrect(
    player
) {

    const p =
        player.problem;


    player.firstAnswer
        .classList
        .add(
            "correct"
        );


    player.firstGroup
        .classList
        .add(
            "done"
        );



    /*
       핵심:
       앞의 두 수의 답을
       그대로 아래 계산의 첫 수로 사용
    */

    player.carriedNumber
        .textContent =
        p.middle;


    player.reducedPart
        .textContent =
        `${p.op2} ${p.c} =`;


    player.continueCaption
        .textContent =
        `${p.middle}을(를) 다음 수와 이어서 계산해요`;


    player.continueArea
        .classList
        .add(
            "show"
        );


    player.step =
        2;


    player.message
        .className =
        "message correct-message";


    player.message
        .textContent =
        `② ${p.middle}과(와) ${p.c}을(를) 이어서 계산해요.`;


    playStepSound();
}



/* ========================================================
   최종 정답
======================================================== */

function finalCorrect(
    player
) {

    player.locked =
        true;


    setButtonsEnabled(
        player,
        false
    );


    player.finalAnswer
        .classList
        .add(
            "correct"
        );


    player.questionToken
        .textContent =
        player.problem.answer;


    player.progress++;


    updateProgress(
        player
    );


    player.message
        .className =
        "message correct-message";


    player.message
        .textContent =
        "⭕ 맞았어요! 세 수를 순서대로 계산했어요.";


    playCorrectSound();



    /* 목적지 도착 */

    if (
        player.progress >=
        goal
    ) {

        setTimeout(

            () => {

                finishPlayer(
                    player
                );
            },

            800
        );


        return;
    }



    /* 다음 문제 */

    setTimeout(

        () => {

            if (
                !stopped &&
                !player.finished
            ) {

                loadProblem(
                    player
                );
            }
        },

        1050
    );
}



/* ========================================================
   오답
======================================================== */

function wrongAnswer(
    player,
    answerBox
) {

    player.locked =
        true;


    setButtonsEnabled(
        player,
        false
    );


    answerBox
        .classList
        .add(
            "wrong"
        );


    /*
       틀리면
       즉시 출발점
    */

    player.progress =
        0;


    updateProgress(
        player
    );


    player.message
        .className =
        "message wrong-message";


    player.message
        .textContent =
        "❌ 틀렸어요! 출발점으로 돌아가요.";


    playWrongSound();



    setTimeout(

        () => {

            if (
                !stopped &&
                !player.finished
            ) {

                loadProblem(
                    player
                );
            }
        },

        1400
    );
}



/* ========================================================
   진행도
======================================================== */

function updateProgress(
    player
) {

    const ratio =
        Math.min(

            player.progress /
            goal,

            1
        );


    const left =
        6 +
        ratio * 88;


    player.runner
        .style
        .left =
        `${left}%`;


    player.progressText
        .textContent =
        `${player.progress} / ${goal}`;
}

/* ========================================================
   문제 생성
======================================================== */

function createProblem() {

    if (
        gameMode ===
        "add"
    ) {

        return makeAddition();
    }


    if (
        gameMode ===
        "sub"
    ) {

        return makeSubtraction();
    }


    const types = [

        "add",

        "sub",

        "addSub",

        "subAdd"
    ];


    const type =
        types[

            randomInt(

                0,

                types.length - 1
            )
        ];


    switch (
        type
    ) {

        case "add":

            return makeAddition();


        case "sub":

            return makeSubtraction();


        case "addSub":

            return makeAddSub();


        default:

            return makeSubAdd();
    }
}



/* ========================================================
   세 수 덧셈
======================================================== */

function makeAddition() {

    while (
        true
    ) {

        const a =
            randomInt(
                1,
                7
            );


        const b =
            randomInt(
                1,
                7
            );


        const c =
            randomInt(
                1,
                7
            );


        const middle =
            a + b;


        const answer =
            middle + c;


        if (
            middle <= 9 &&
            answer <= 9
        ) {

            return {

                a,

                b,

                c,

                op1: "+",

                op2: "+",

                middle,

                answer
            };
        }
    }
}



/* ========================================================
   세 수 뺄셈
======================================================== */

function makeSubtraction() {

    while (
        true
    ) {

        const a =
            randomInt(
                3,
                9
            );


        const b =
            randomInt(
                1,
                a - 1
            );


        const middle =
            a - b;


        if (
            middle < 1
        ) {

            continue;
        }


        const c =
            randomInt(
                1,
                middle
            );


        const answer =
            middle - c;


        return {

            a,

            b,

            c,

            op1: "-",

            op2: "-",

            middle,

            answer
        };
    }
}



/* ========================================================
   덧셈 → 뺄셈
======================================================== */

function makeAddSub() {

    while (
        true
    ) {

        const a =
            randomInt(
                1,
                7
            );


        const b =
            randomInt(
                1,
                7
            );


        const middle =
            a + b;


        if (
            middle > 9
        ) {

            continue;
        }


        const c =
            randomInt(
                1,
                middle
            );


        const answer =
            middle - c;


        return {

            a,

            b,

            c,

            op1: "+",

            op2: "-",

            middle,

            answer
        };
    }
}



/* ========================================================
   뺄셈 → 덧셈
======================================================== */

function makeSubAdd() {

    while (
        true
    ) {

        const a =
            randomInt(
                2,
                9
            );


        const b =
            randomInt(
                1,
                a - 1
            );


        const middle =
            a - b;


        const maxC =
            9 - middle;


        if (
            maxC < 1
        ) {

            continue;
        }


        const c =
            randomInt(
                1,
                maxC
            );


        const answer =
            middle + c;


        return {

            a,

            b,

            c,

            op1: "-",

            op2: "+",

            middle,

            answer
        };
    }
}

    }


    document
        .querySelectorAll(
            ".countdown-overlay"
        )
        .forEach(
            element =>
                element.remove()
        );


    gameScreen
        .classList
        .add(
            "hidden"
        );


    startScreen
        .classList
        .remove(
            "hidden"
        );
}



/* ========================================================

======================================================== */

function randomInt(
    min,
    max
) {

    return Math.floor(

        Math.random() *

        (
            max -
            min +
            1
        )

    ) + min;
}



/* ========================================================
   오디오
======================================================== */

function initAudio() {

    if (
        !audioContext
    ) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (
            AudioContext
        ) {

            audioContext =
                new AudioContext();
        }
    }


    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}



function tone(

    frequency,

    duration,

    delay = 0,

    type = "sine",

    volume = 0.1
) {

    if (
        !audioContext
    ) {

        return;
    }


    const start =
        audioContext.currentTime +
        delay;


    const oscillator =
        audioContext
        .createOscillator();


    const gain =
        audioContext
        .createGain();


    oscillator.type =
        type;


    oscillator.frequency
        .setValueAtTime(

            frequency,

            start
        );


    gain.gain
        .setValueAtTime(

            volume,

            start
        );


    gain.gain
        .exponentialRampToValueAtTime(

            0.001,

            start +
            duration
        );


    oscillator.connect(
        gain
    );


    gain.connect(
        audioContext.destination
    );


    oscillator.start(
        start
    );


    oscillator.stop(

        start +
        duration
    );
}
